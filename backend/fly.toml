app = "quorum-backend"
primary_region = "ams"

[build]

[env]
  PORT = "8000"
  QUORUM_DATABASE_URL = "sqlite:////data/quorum.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "quorum_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
